<style>

table.ot{table-layout:fixed;min-width:760px}table.ot th:nth-child(2){width:90px}table.ot th:nth-child(3){width:120px}table.ot th:nth-child(4){width:160px}table.ot th:nth-child(5){width:100px}table.ot th:nth-child(6){width:150px}table.ot td{vertical-align:middle;white-space:nowrap}table.ot td:first-child{white-space:normal}table.ot .i-name{font-size:15px}table.ot .i-sub{margin:2px 0 0}table.ot .stepper{gap:6px;justify-content:center}table.ot .stepper button{width:34px;height:34px}table.ot .stepper button.pm::before,table.ot .stepper button.pm.pl::after{width:12px}table.ot .stepper button.pm.pl::after{width:3px;height:12px}table.ot th{text-align:center}table.ot th:first-child{text-align:left}
.mo{display:none}@media(max-width:760px){table.ot{min-width:0}table.ot th:nth-child(2),table.ot td:nth-child(2),table.ot th:nth-child(3),table.ot td:nth-child(3),table.ot th:nth-child(n+5),table.ot td:nth-child(n+5){display:none}table.ot th:nth-child(4){width:140px}table.ot td:first-child,table.ot th:first-child{position:static}.mo{display:block}.mcost{text-align:center;font-weight:700;margin-top:4px;font-size:14px}}
.lockmsg{margin:8px 0 0;padding:10px 14px;border-radius:14px;background:var(--errc);color:var(--err);font-size:14px}.lockmsg.mine{background:var(--surf2);color:var(--on)}
.cpill{display:inline-block;padding:4px 10px;border-radius:99px;font-size:13px;background:var(--surf2);color:var(--on2)}.cpill.ok{background:var(--okc);color:var(--ok);font-weight:600}.cpill.warn{background:var(--warnc);color:var(--warn)}
.tw{overflow:auto;border-radius:18px;border:1px solid var(--line);background:var(--surf)}

<body>
<header><div class="hin">
  <h1><img class="logo" src="logo-512.jpg" alt="Schrank App logo"><span>Schrank App</span></h1>
  <nav class="tabs" id="tabs"></nav>
  <span id="sync" class="pill">Connecting…</span>
  <button class="ibtn" id="meBtn" title="Who am I" style="width:auto;border-radius:99px;padding:0 14px;font-size:14px;font-weight:600"></button>
  <button class="ibtn" id="admBtn" title="Admin">🔒</button>
  <button class="ibtn" id="themeBtn" title="Theme">☾</button>
</div></header>
<main id="main"></main>
<div class="mascot l" aria-hidden="true"></div><div class="mascot r" aria-hidden="true"></div>
<div id="costbar" class="costbar hide"></div>
<div id="nope" role="alertdialog" aria-label="No"><img src="angry-512.jpg" alt="Schrank, angry"><b>NO</b><small>That one only comes whole. Click to close.</small></div>
<div class="overlay" id="ov"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>

<script>
// <core>
const EPS=1e-6;
function arr(x){return Array.isArray(x)?x.filter(v=>v!=null):(x&&typeof x==='object'?Object.keys(x).sort((a,b)=>a-b).map(k=>x[k]).filter(v=>v!=null):[])}
function num(v){const n=parseFloat(v);return Number.isFinite(n)&&n>0?Math.round(n*1e4)/1e4:0}
function r4(x){return Math.round(x*1e4)/1e4}
function uid(p){return (p||'i')+Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-3)}
// ids from the (publicly writable) DB end up in HTML attributes and write paths: only allow safe ones
function validId(s){return typeof s==='string'&&/^[\w-]{1,64}$/.test(s)}
// round a typed quantity to the nearest multiple of the item's step (min 0)
function snapQty(q,step){const s=num(step)||1;return num(Math.round(num(q)/s)*s)}
// set obj[a][b][c]=v along "a/b/c", creating objects; v==null deletes the leaf
function setPath(obj,path,v){const ks=path.split('/');let o=obj;for(let i=0;i<ks.length-1;i++){if(!o[ks[i]]||typeof o[ks[i]]!=='object')o[ks[i]]={};o=o[ks[i]]}const k=ks[ks.length-1];if(v==null)delete o[k];else o[k]=v;return obj}
// drop duplicate paths and any path whose ancestor is also present (Firebase update() rejects overlapping paths)
function compactPaths(paths){const u=[...new Set(paths)];return u.filter(p=>!u.some(q=>q!==p&&p.startsWith(q+'/')))}
function mkItem(o){return Object.assign({id:uid('i'),name:'',uom:'',coo:'',unit:'unit',costPerLb:null,lbsPerUnit:1,incPerCase:1,step:1},o||{})}
function normItem(i){
  i=i&&typeof i==='object'?i:{};
  const p=(i.costPerLb===''||i.costPerLb==null)?null:parseFloat(i.costPerLb);
  const lbs=parseFloat(i.lbsPerUnit),inc=parseFloat(i.incPerCase),st=parseFloat(i.step);
  return {id:String(i.id||uid('i')),name:String(i.name||''),uom:String(i.uom||''),coo:String(i.coo||''),unit:String(i.unit||'unit'),
    costPerLb:Number.isFinite(p)&&p>=0?p:null,lbsPerUnit:Number.isFinite(lbs)&&lbs>0?lbs:1,incPerCase:Number.isFinite(inc)&&inc>0?inc:1,step:Number.isFinite(st)&&st>0?st:1};
}
function normBlock(b){
  b=b&&typeof b==='object'?b:{};
  return {id:String(b.id||uid('b')),title:String(b.title||'Order'),delivery:String(b.delivery||''),deadline:String(b.deadline||''),note:String(b.note||''),items:arr(b.items).map(normItem).filter(i=>validId(i.id))};
}
function normRound(r,id){
  r=r&&typeof r==='object'?r:{};
  const blocks=arr(r.blocks).map(normBlock).filter(b=>validId(b.id));
  return {id:String(id),title:String(r.title||'Order round'),status:r.status==='locked'?'locked':'open',createdAt:Number(r.createdAt)||0,blocks,orders:r.orders&&typeof r.orders==='object'?r.orders:{},log:normLog(r.log),done:normDone(r.done)};
}
// personal 'I'm done' locks: {personId: time locked}
function normDone(d){const o={};if(d&&typeof d==='object')Object.keys(d).forEach(k=>{const v=Number(d[k]);if(v>0)o[k]=v});return o}
// order history: {t:first time, u:last touch, p:person, i:item, f:qty before, q:qty after, a:1 if admin made it, n/m: person/item name snapshots}
function normLog(l){
  const out={};if(!l||typeof l!=='object')return out;
  Object.keys(l).forEach(k=>{const e=l[k];if(!validId(k)||!e||typeof e!=='object'||!validId(e.p)||!validId(e.i))return;
    const t=Number(e.t);if(!Number.isFinite(t)||t<=0)return;const u=Number(e.u);
    out[k]={t,p:e.p,i:e.i,f:num(e.f),q:num(e.q),a:e.a?1:0,n:String(e.n||'').slice(0,80),m:String(e.m||'').slice(0,160)};
    if(Number.isFinite(u)&&u>=t)out[k].u=u});
  return out;
}
// record a qty change; quick repeat edits by the same actor on the same person+item within 2 min fold into one entry
// (an entry whose net change becomes zero is removed). Returns the touched log id, or null.
const LOG_MERGE_MS=120000;
function logChange(R,pid,itemId,from,to,byAdmin,pname,iname,now){
  from=num(from);to=num(to);if(from===to)return null;if(!R.log)R.log={};
  const a=byAdmin?1:0;let last=null,lastId=null;
  Object.keys(R.log).forEach(k=>{const e=R.log[k];if(e.p===pid&&e.i===itemId&&(!last||e.t>=last.t)){last=e;lastId=k}});
  if(last&&last.a===a&&now-(last.u||last.t)<LOG_MERGE_MS){last.q=to;last.u=now;if(last.q===last.f)delete R.log[lastId];return lastId}
  const id=uid('h');R.log[id]={t:now,p:pid,i:itemId,f:from,q:to,a,n:String(pname||'').slice(0,80),m:String(iname||'').slice(0,160)};return id;
}

async function hashPw(pw){

    const err=m=>$('#pwErr').textContent=m;

function openGap(rid,itemId){

    const tag=p=>p.id in rank?`<div class="note">#${rank[p.id]+1} · since ${esc(fmtT(pr[rank[p.id]].since))}</div>`:'';

}

/* ---- Excel export ---- */
function loadExcelJS(){
  if(window.ExcelJS)return Promise.resolve();
  return new Promise((res,rej)=>{const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js';s.onload=res;s.onerror=()=>rej(new Error('could not load Excel library (offline?)'));document.head.appendChild(s)});
}
function colL(n){let s='';while(n>0){const m=(n-1)%26;s=String.fromCharCode(65+m)+s;n=Math.floor((n-1)/26)}return s}
async function exportRoundXlsx(rid){
  await loadExcelJS();
  const R=S.rounds[rid],ppl=peopleSorted();
  const wb=new ExcelJS.Workbook(),ws=wb.addWorksheet((R.title.replace(/[\\\/?*\[\]:]/g,'')||'Order').slice(0,31),{views:[{showGridLines:true}]});
  const bold={bold:true},fill={type:'pattern',pattern:'solid',fgColor:{argb:'FFE6F2F1'}};
  const thin={style:'thin',color:{argb:'FFBEC9C8'}},box={top:thin,left:thin,bottom:thin,right:thin};
  ws.getColumn(1).width=3;ws.getColumn(2).width=22;
  let r=2;
  R.blocks.forEach((b,bi)=>{
    const n=b.items.length,first=3,last=first+n-1,costCol=Math.max(10,last+2);
    for(let c=first;c<=costCol;c++)if(!ws.getColumn(c).width||ws.getColumn(c).width<18)ws.getColumn(c).width=c===costCol?18:20;
    ws.getCell(r,2).value=b.title.toUpperCase();ws.getCell(r,2).font={bold:true,size:14};
    const dates=[b.deadline?`ORDER DEADLINE: ${fmtDay(b.deadline).toUpperCase()}`:'',`DELIVERY DATE: ${(fmtDay(b.delivery)||'TBD').toUpperCase()}`].filter(Boolean).join('   ');
    ws.getCell(r,6).value=dates;ws.getCell(r,6).font={bold:true,color:{argb:'FFBA1A1A'}};
    const hasCoo=b.items.some(i=>i.coo);
    const itemRow=r+2,uomRow=itemRow+1;let row=uomRow+1;const cooRow=hasCoo?row++:0,priceRow=row++,lbsRow=row++;
    ws.getCell(itemRow,2).value='Item';ws.getCell(uomRow,2).value='UoM';if(cooRow)ws.getCell(cooRow,2).value='COO';ws.getCell(priceRow,2).value='Cost per Lb';ws.getCell(lbsRow,2).value='Lbs per Piece';
    if(b.note)ws.getCell(itemRow,costCol).value=b.note;
    ws.getCell(lbsRow,costCol).value='Est. Cost/Person';ws.getCell(lbsRow,costCol).font=bold;
    b.items.forEach((i,k)=>{const c=first+k;
      ws.getCell(itemRow,c).value=i.name;ws.getCell(uomRow,c).value=i.uom;if(cooRow)ws.getCell(cooRow,c).value=i.coo;
      if(i.costPerLb!=null){ws.getCell(priceRow,c).value=i.costPerLb;ws.getCell(priceRow,c).numFmt='$#,##0.00'}
      ws.getCell(lbsRow,c).value=i.lbsPerUnit;
      [itemRow,uomRow,cooRow,priceRow,lbsRow].filter(Boolean).forEach(rr=>{const cell=ws.getCell(rr,c);cell.alignment={wrapText:true,vertical:'top',horizontal:'center'}});
      ws.getCell(itemRow,c).font=bold;
    });
    for(let rr=itemRow;rr<=lbsRow;rr++){for(let c=2;c<=Math.max(last,costCol);c++){const cell=ws.getCell(rr,c);cell.fill=fill;cell.border=box}ws.getCell(rr,2).font=bold}
    const p0=lbsRow+1;let pr=p0;
    ppl.forEach(p=>{
      ws.getCell(pr,2).value=p.name;ws.getCell(pr,2).border=box;
      b.items.forEach((i,k)=>{const q=num(R.orders[p.id]&&R.orders[p.id][i.id]);const cell=ws.getCell(pr,first+k);if(q)cell.value=q;cell.border=box;cell.alignment={horizontal:'center'}});
      const L=colL(first),La=colL(last);
      const cc=ws.getCell(pr,costCol);cc.value={formula:`SUMPRODUCT(${L}${pr}:${La}${pr},$${L}$${priceRow}:$${La}$${priceRow},$${L}$${lbsRow}:$${La}$${lbsRow})`};cc.numFmt='$#,##0.00';cc.border=box;
      pr++;
    });
    const p1=Math.max(pr-1,p0),tI=pr,incR=pr+1,tC=pr+2;
    ws.getCell(tI,2).value='Total Increments';ws.getCell(incR,2).value='Increments/Case';ws.getCell(tC,2).value='Total Cases';
    b.items.forEach((i,k)=>{const c=first+k,L=colL(c);
      ws.getCell(tI,c).value={formula:ppl.length?`SUM(${L}${p0}:${L}${p1})`:'0'};
      ws.getCell(incR,c).value=i.incPerCase;
      ws.getCell(tC,c).value={formula:`${L}${tI}/${L}${incR}`};ws.getCell(tC,c).numFmt='0.00';
    });
    ws.getCell(tI,costCol).value={formula:ppl.length?`SUM(${colL(costCol)}${p0}:${colL(costCol)}${p1})`:'0'};ws.getCell(tI,costCol).numFmt='$#,##0.00';
    [tI,incR,tC].forEach(rr=>{for(let c=2;c<=Math.max(last,costCol);c++){const cell=ws.getCell(rr,c);cell.fill=fill;cell.border=box;if(c>2&&c<=last)cell.alignment={horizontal:'center'}}ws.getCell(rr,2).font=bold});
    r=tC+2;
  });
  const buf=await wb.xlsx.writeBuffer();
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}));
  a.download=(R.title.replace(/[^\w\- ]+/g,'')||'Order')+' - Food Orders.xlsx';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);
  toast('Exported');
}

/* ---- boot ---- */
function boot(){
  let fresh=true,raw=null;
  try{raw=localStorage.getItem('shranck_data');if(raw)fresh=false}catch(e){}
  try{S=normalize(raw?JSON.parse(raw):null)}catch(e){S=normalize(null)}

  try{ADM=sessionStorage.getItem('shranck_admin')==='1'&&!!S.adminHash}catch(e){}

}

  onValue(node, snap => {
    if(window.__setSync) window.__setSync('on');
    if(window.__applyRemote) window.__applyRemote(snap.val());
  }, err => { console.warn('fb sync error', err); if(window.__setSync) window.__setSync('err'); });
}catch(e){ console.warn('Firebase init failed — local only', e); if(window.__setSync) window.__setSync('err'); }
</script>
</body>
