<body>
<header><div class="hin">
  <h1><img class="logo" src="logo-512.jpg" alt="Schrank App logo"><span>Schrank App</span></h1>
  <nav class="tabs" id="tabs"></nav>
  <span id="sync" class="pill">Connecting…</span>
  <button class="ibtn" id="meBtn" title="Who am I" style="width:auto;border-radius:99px;padding:0 14px;font-size:14px;font-weight:600"></button>
  <button class="ibtn" id="admBtn" title="Admin">🔒</button>
  <button class="ibtn" id="themeBtn" title="Theme">☾</button>
</div></header>
<main id="main"></main>
<div class="mascot l" aria-hidden="true"></div><div class="mascot r" aria-hidden="true"></div>
<div id="costbar" class="costbar hide"></div>
<div id="nope" role="alertdialog" aria-label="No"><img src="angry-512.jpg" alt="Schrank, angry"><b>NO</b><small>That one only comes whole. Click to close.</small></div>
<img src="crossarm-512.jpg" alt="" hidden>
<div id="knew" role="alertdialog" aria-label="I knew it"><img src="help-512.jpg" alt="Schrank, unimpressed"><b>I knew it.</b><small>Couldn't even last 30 seconds. Click to close.</small></div>
<div id="finger" role="alertdialog" aria-label="Oh. It's you."><img src="finger-512.jpg" alt="Schrank, giving you the finger"><small>Oh. It's you. Click to close.</small></div>
<div class="overlay" id="ov"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>

<script>
// <core>
const EPS=1e-6;
function arr(x){return Array.isArray(x)?x.filter(v=>v!=null):(x&&typeof x==='object'?Object.keys(x).sort((a,b)=>a-b).map(k=>x[k]).filter(v=>v!=null):[])}
function num(v){const n=parseFloat(v);return Number.isFinite(n)&&n>0?Math.round(n*1e4)/1e4:0}
function r4(x){return Math.round(x*1e4)/1e4}
function uid(p){return (p||'i')+Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-3)}
// ids from the (publicly writable) DB end up in HTML attributes and write paths: only allow safe ones
function validId(s){return typeof s==='string'&&/^[\w-]{1,64}$/.test(s)}
// round a typed quantity to the nearest multiple of the item's step (min 0)
function snapQty(q,step){const s=num(step)||1;return num(Math.round(num(q)/s)*s)}
// set obj[a][b][c]=v along "a/b/c", creating objects; v==null deletes the leaf
function setPath(obj,path,v){const ks=path.split('/');let o=obj;for(let i=0;i<ks.length-1;i++){if(!o[ks[i]]||typeof o[ks[i]]!=='object')o[ks[i]]={};o=o[ks[i]]}const k=ks[ks.length-1];if(v==null)delete o[k];else o[k]=v;return obj}
// drop duplicate paths and any path whose ancestor is also present (Firebase update() rejects overlapping paths)
function compactPaths(paths){const u=[...new Set(paths)];return u.filter(p=>!u.some(q=>q!==p&&p.startsWith(q+'/')))}

/* ---- persistence ---- */
function dataObject(){return JSON.parse(JSON.stringify(S))}
function saveLocal(){try{localStorage.setItem('shranck_data',JSON.stringify(dataObject()))}catch(e){}}
function getPath(p){let o=S;for(const k of p.split('/')){if(o==null)return undefined;o=o[k]}return o}
function saveQueue(){try{if(QUEUE.size)localStorage.setItem('shranck_queue',JSON.stringify([...QUEUE]));else localStorage.removeItem('shranck_queue')}catch(e){}}
function snapVal(p){const v=getPath(p);return v===undefined?null:JSON.parse(JSON.stringify(v))}
function persist(paths){
  S.savedAt=Date.now();saveLocal();
  if(!paths||!paths.length)return; // whole-tree writes are never made (they clobber others' edits)
  if(!window.__fbUpdate){paths.forEach(p=>QUEUE.add(p));saveQueue();return} // Firebase not ready yet: flushed on first snapshot

function flushQueue(){const u={};compactPaths([...QUEUE]).forEach(p=>u[p]=snapVal(p));QUEUE.clear();saveQueue();if(Object.keys(u).length)window.__fbUpdate(u);return u}

  if(val==null){markReady();if(window.__fbSeed)window.__fbSeed(seedState());return} // seed only if still empty (transaction), never with local data

function initMascots(){
  const ms=[...document.querySelectorAll('.mascot')];if(!ms.length)return;
  setMascotFace('meh');
  if(matchMedia('(min-width:1280px) and (hover:hover) and (pointer:fine)').matches)['watch1.png','watch2.png','watch3.png'].forEach(s=>{new Image().src=s});
  setInterval(()=>{try{setMascotFace(mascotFace())}catch(e){}},5000);
  ms.forEach(m=>{const blink=()=>{m.classList.add('blink');setTimeout(()=>m.classList.remove('blink'),150);setTimeout(blink,2500+Math.random()*4500)};setTimeout(blink,1500+Math.random()*3000)});
  let mx=innerWidth/2,my=innerHeight/2,q=0,last=0; // cross-eye ramps up as the mouse nears the nose (starts ~3.5 nose-widths out, full on the nose)
  const pos=(pu,x,y,flip)=>{if(pu.tagName==='text'){pu.setAttribute('x',x);pu.setAttribute('y',y);if(flip)pu.setAttribute('transform',`translate(${2*x} 0) scale(-1 1)`)}else{pu.setAttribute('cx',x);pu.setAttribute('cy',y)}};
  const upd=now=>{q=0;const dt=last?Math.min(50,now-last):16;last=now;let busy=false;const F=FACES[FACE],NOSE=F.nose;
    ms.forEach(m=>{if(!m.offsetWidth)return;const flip=m.classList.contains('r');
    const sv=m.querySelector('svg'),ctm=sv.getScreenCTM();let k=0;
    if(ctm){const pt=new DOMPoint(mx,my).matrixTransform(ctm.inverse()),r=Math.hypot((pt.x-NOSE[0])/NOSE[2],(pt.y-NOSE[1])/NOSE[3]);k=Math.min(1,Math.max(0,(3.5-r)/2.5))}
    const s=k*k*(3-2*k);
    m.querySelectorAll('.pu').forEach(pu=>{const e=F.eyes[+pu.dataset.e],i=+pu.dataset.e?-1:1;pu.removeAttribute('transform');pos(pu,e.p[0],e.p[1]);
      const b=pu.getBoundingClientRect(),dx=mx-(b.left+b.width/2),dy=my-(b.top+b.height/2),d=Math.hypot(dx,dy)||1,t=Math.min(1,d/180);
      const tx=e.c[0]+(flip?-1:1)*dx/d*e.m[0]*t,ty=e.c[1]+dy/d*(dy>0&&e.dn?e.dn:e.m[1])*t,xx=e.c[0]+i*e.m[0],xy=e.c[1]+e.m[1]*.55;
      const X=tx+(xx-tx)*s;pos(pu,X,ty+(xy-ty)*s+(e.sl||0)*(X-e.c[0]),flip)})});
    if(busy)q=requestAnimationFrame(upd);else last=0};

function caseInfo(t,it){
  const u=it.unit||'unit';
  if(!t.total)return {cls:'',html:`No orders yet · ${t.inc>1?t.inc+' per case':'1 '+esc(u)+' = 1 case'}`,pct:0};
  if(t.aligned)return {cls:'ok',html:`✓ ${t.total} ${esc(u)}${t.total===1?'':'s'} = ${t.fullCases} case${t.fullCases===1?'':'s'} — lines up`,pct:100};
  const next=(t.fullCases+1)*t.inc;
  return {cls:'warn',html:`${t.total} of ${next} for ${t.fullCases+1} case${t.fullCases?'s':''} · <b>${t.short} short</b>`+(t.fullCases>0?` <span style="opacity:.8">(or ${t.over} over ${t.fullCases} case${t.fullCases===1?'':'s'})</span>`:''),pct:Math.round(t.over/t.inc*100)};
}

// set a qty + record it in the round's history; returns the leaf paths to write (never the whole, possibly stale, order map)
function setQtyLogged(R,pid,it,q,byAdmin){

const ISO_D=/^\d{4}-\d{2}-\d{2}$/;

function fmtDay(v){v=String(v||'');if(!ISO_D.test(v))return v;const[y,m,d]=v.split('-').map(Number),dt=new Date(y,m-1,d),n=d%100,suf=n>10&&n<14?'th':['th','st','nd','rd'][n%10]||'th';
  return `${dt.toLocaleDateString('en-CA',{weekday:'long'})} ${dt.toLocaleDateString('en-CA',{month:'short'}).replace('.','')} ${d}${suf}`}
const fmtT=t=>t?new Date(t).toLocaleString('en-CA',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}):'before history began';

/* ---- admin gate ---- */
async function hashPw(pw){
  try{if(window.crypto&&crypto.subtle){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('shranck:'+pw));return 's:'+Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('')}}catch(e){}
  let h=5381;const s='shranck:'+pw;for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return 'd:'+(h>>>0).toString(16);
}
async function verifyPw(pw){const h=latestHash();if(h.startsWith('d:')){return h===(await hashPw.call(null,pw).then(x=>x.startsWith('d:')?x:fallbackHash(pw)))}return h===await hashPw(pw)}
function fallbackHash(pw){let h=5381;const s='shranck:'+pw;for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return 'd:'+(h>>>0).toString(16)}

$('#admBtn').onclick=()=>{
  if(ADM){ADM=false;try{sessionStorage.removeItem('shranck_admin')}catch(e){}TAB='order';renderAll();return}
  if(!READY)return;
  const first=!latestHash(); // newest data incl. any held-back snapshot, not possibly-stale S
  openModal(`<h2>${first?'Set admin PIN':'Admin'}</h2><div class="field"><label>${first?'Choose a PIN (4+ characters)':'PIN'}</label><input id="pw" type="password" autocomplete="off"></div>${first?`<div class="field"><label>Confirm PIN</label><input id="pw2" type="password" autocomplete="off"></div>`:''}<div id="pwErr" class="note" style="color:var(--err)"></div><div class="row2" style="justify-content:flex-end"><button class="btn ghost" id="pwX">Cancel</button><button class="btn" id="pwOk">${first?'Set PIN':'Unlock'}</button></div>`,()=>{
    const err=m=>$('#pwErr').textContent=m;
    const go=async()=>{const pw=$('#pw').value;
      if(first){if(pw.length<4)return err('At least 4 characters.');if(pw!==$('#pw2').value)return err('PINs do not match.');
        const exists='An admin PIN already exists. Cancel and unlock with that PIN.';
        if(latestHash())return err(exists);
        const h=await hashPw(pw),ok_=$('#pwOk');
        if(window.__fbSetIfEmpty){ // atomic: only succeeds if the DB has no PIN yet
          ok_.disabled=true;let ok=false;
          try{ok=await window.__fbSetIfEmpty('adminHash',h)}catch(e){ok_.disabled=false;return err('Could not save the PIN (offline?). Try again.')}
          if(!ok){ok_.disabled=false;return err(exists)}
        }else PENDING_PIN=h; // local-only mode: claimed atomically once Firebase connects
        S.adminHash=h;saveLocal();closeModal();unlock()}
      else{if(await verifyPw(pw)){closeModal();unlock()}else err('Wrong PIN.')}};
    $('#pwOk').onclick=go;$('#pwX').onclick=closeModal;$('#pw').onkeydown=e=>{if(e.key==='Enter')go()};setTimeout(()=>$('#pw').focus(),50)});
};

function openGap(rid,itemId){
  const R=S.rounds[rid],it=findItem(R,itemId);if(!it)return;

    const t=itemTotals(R,itemId),pr=orderPriority(R,itemId),rank={};pr.forEach((x,k)=>rank[x.pid]=k);
    const ppl=[...pr.map(x=>S.people[x.pid]).filter(Boolean),...peopleSorted().filter(p=>!(p.id in rank))];
    const tag=p=>p.id in rank?`<div class="note">#${rank[p.id]+1} · since ${esc(fmtT(pr[rank[p.id]].since))}</div>`:'';
    const up=t.aligned?0:t.short,down=t.over;

  };

}

/* ---- Excel export ---- */
function loadExcelJS(){
  if(window.ExcelJS)return Promise.resolve();
  return new Promise((res,rej)=>{const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js';s.onload=res;s.onerror=()=>rej(new Error('could not load Excel library (offline?)'));document.head.appendChild(s)});
}
function colL(n){let s='';while(n>0){const m=(n-1)%26;s=String.fromCharCode(65+m)+s;n=Math.floor((n-1)/26)}return s}
async function exportRoundXlsx(rid){

  const bold={bold:true},fill={type:'pattern',pattern:'solid',fgColor:{argb:'FFE6F2F1'}};
  const thin={style:'thin',color:{argb:'FFBEC9C8'}},box={top:thin,left:thin,bottom:thin,right:thin};

    ws.getCell(r,2).value=b.title.toUpperCase();ws.getCell(r,2).font={bold:true,size:14};
    const dates=[b.deadline?`ORDER DEADLINE: ${fmtDay(b.deadline).toUpperCase()}`:'',`DELIVERY DATE: ${(fmtDay(b.delivery)||'TBD').toUpperCase()}`].filter(Boolean).join('   ');
    ws.getCell(r,6).value=dates;ws.getCell(r,6).font={bold:true,color:{argb:'FFBA1A1A'}};
    const hasCoo=b.items.some(i=>i.coo);
    const itemRow=r+2,uomRow=itemRow+1;let row=uomRow+1;const cooRow=hasCoo?row++:0,priceRow=row++,lbsRow=row++;
    ws.getCell(itemRow,2).value='Item';ws.getCell(uomRow,2).value='UoM';if(cooRow)ws.getCell(cooRow,2).value='COO';ws.getCell(priceRow,2).value='Cost per Lb';ws.getCell(lbsRow,2).value='Lbs per Piece';
    if(b.note)ws.getCell(itemRow,costCol).value=b.note;
    ws.getCell(lbsRow,costCol).value='Est. Cost/Person';ws.getCell(lbsRow,costCol).font=bold;
    b.items.forEach((i,k)=>{const c=first+k;
      ws.getCell(itemRow,c).value=i.name;ws.getCell(uomRow,c).value=i.uom;if(cooRow)ws.getCell(cooRow,c).value=i.coo;
      if(i.costPerLb!=null){ws.getCell(priceRow,c).value=i.costPerLb;ws.getCell(priceRow,c).numFmt='$#,##0.00'}
      ws.getCell(lbsRow,c).value=i.lbsPerUnit;
      [itemRow,uomRow,cooRow,priceRow,lbsRow].filter(Boolean).forEach(rr=>{const cell=ws.getCell(rr,c);cell.alignment={wrapText:true,vertical:'top',horizontal:'center'}});
      ws.getCell(itemRow,c).font=bold;
    });
    for(let rr=itemRow;rr<=lbsRow;rr++){for(let c=2;c<=Math.max(last,costCol);c++){const cell=ws.getCell(rr,c);cell.fill=fill;cell.border=box}ws.getCell(rr,2).font=bold}
    const p0=lbsRow+1;let pr=p0;
    ppl.forEach(p=>{
      ws.getCell(pr,2).value=p.name;ws.getCell(pr,2).border=box;
      b.items.forEach((i,k)=>{const q=num(R.orders[p.id]&&R.orders[p.id][i.id]);const cell=ws.getCell(pr,first+k);if(q)cell.value=q;cell.border=box;cell.alignment={horizontal:'center'}});
      const L=colL(first),La=colL(last);
      const cc=ws.getCell(pr,costCol);cc.value={formula:`SUMPRODUCT(${L}${pr}:${La}${pr},$${L}$${priceRow}:$${La}$${priceRow},$${L}$${lbsRow}:$${La}$${lbsRow})`};cc.numFmt='$#,##0.00';cc.border=box;

    });

    [tI,incR,tC].forEach(rr=>{for(let c=2;c<=Math.max(last,costCol);c++){const cell=ws.getCell(rr,c);cell.fill=fill;cell.border=box;if(c>2&&c<=last)cell.alignment={horizontal:'center'}}ws.getCell(rr,2).font=bold});

  });
  const buf=await wb.xlsx.writeBuffer();
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}));
  a.download=(R.title.replace(/[^\w\- ]+/g,'')||'Order')+' - Food Orders.xlsx';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);
  toast('Exported');
}

/* ---- boot ---- */
function boot(){
  let fresh=true,raw=null;
  try{raw=localStorage.getItem('shranck_data');if(raw)fresh=false}catch(e){}
  try{S=normalize(raw?JSON.parse(raw):null)}catch(e){S=normalize(null)}
  try{ME=localStorage.getItem('shranck_me')}catch(e){}
  try{const q=JSON.parse(localStorage.getItem('shranck_queue')||'[]');if(Array.isArray(q))q.forEach(p=>{if(typeof p==='string')QUEUE.add(p)})}catch(e){}
  try{ADM=sessionStorage.getItem('shranck_admin')==='1'&&!!S.adminHash}catch(e){}
  validateMe();applyThemeBtn();renderAll();showFinger();
  if(fresh)checkWhatsNew(true);
  else if(me())checkWhatsNew(false); // the name picker opens from markReady() once data has loaded
  if('serviceWorker' in navigator&&/^https?:/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{});
}
boot();
</script>
